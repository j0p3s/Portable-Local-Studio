name: Build and publish release
on:
  push:
    tags:
      - 'v1.0.0'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: app/frontend
      - run: node --test scripts/tests/*.test.cjs
      - run: npm run build
        working-directory: app/frontend
      - run: python3 scripts/build/package_release.py "$RUNNER_TEMP/release"
      - name: Publish version 1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create v1.0.0
          "$RUNNER_TEMP/release/Portable-Local-Studio-1.0.0.zip"
          "$RUNNER_TEMP/release/SHA256SUMS"
          --verify-tag --title "Portable Local Studio 1.0.0"
          --notes-file docs/releases/1.0.0.md
